[project]
name = "vrp-system"
version = "0.1.0"
description = "Real-time incremental vehicle routing system"
requires-python = ">=3.12"
dependencies = [
    # ── Web / persistence skeleton ──────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",       # Postgres driver; psycopg3, not psycopg2
    "geoalchemy2>=0.15.0",           # PostGIS geometry types <-> SQLModel/SQLAlchemy

    # ── The actual hard problem ─────────────────────────────────────────
    "ortools>=9.11",                 # VRPTW solver, warm-start capable

    # ── Event ordering + background execution ───────────────────────────
    "redis>=5.2.0",                  # Redis Streams client
    "arq>=0.26.0",                   # Redis-backed async task queue (the worker)

    # ── Config / validation ──────────────────────────────────────────────
    "pydantic-settings>=2.6.0",
]

[tool.uv]
# locked resolution — this is what uv.lock captures, and what
# `uv sync --frozen` in the Dockerfile installs exactly, byte-for-byte
# reproducible across your machine and CI/prod.
